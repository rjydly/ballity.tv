name: Ballity Video Pipeline

on:
  schedule:
    # S'executa 3 cops al dia (ex: 12:00, 18:00 i 22:00 UTC)
    - cron: '0 12,18,22 * * *'
  workflow_dispatch:

jobs:
  build-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create Cookies File if Secret Exists
        env:
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: |
          if [ -n "$INSTAGRAM_COOKIES" ]; then
            echo "$INSTAGRAM_COOKIES" > cookies.txt
            echo "Galetes d'Instagram configurades correctament."
          fi

      - name: Run Main Script
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          INSTAGRAM_COOKIES_FILE: "cookies.txt"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Final Git Sync
        if: always()
        run: |
          git add -A videos/ processed_videos.json sources.csv || true
          git commit -m "Sync final state [skip ci]" || true
          git push || true